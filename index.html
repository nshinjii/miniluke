<style>
  /* Layout: a creator card up top (name, flag, numbers), then three tabs that swap the page below.
     Same palette and type as the server page, so the two read as one site. */
  :root {
    --bg: #0b0f0c;
    --surface: #111813;
    --raise: #172019;
    --line: #223026;
    --fg: #e3ebe5;
    --muted: #8a998e;
    --green: #3ddc84;
    --green-ink: #04220f;
    --green-soft: rgba(61, 220, 132, 0.12);
    --green-glow: rgba(61, 220, 132, 0.4);

    --display: "Martian Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--fg); font: 400 17px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  img { max-width: 100%; display: block; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  ::selection { background: var(--green); color: var(--green-ink); }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 4px; }
  h1, h2, h3 { text-wrap: balance; }
  .ico { width: 1em; height: 1em; flex-shrink: 0; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1120px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    font: 600 14px/1 var(--display); padding: 13px 18px; border-radius: 8px; border: 1px solid transparent;
    transition: box-shadow .2s, transform .2s, border-color .2s, color .2s; white-space: nowrap;
  }
  .btn .ico { width: 17px; height: 17px; }
  .btn-go { background: var(--green); color: var(--green-ink); }
  .btn-go:hover { box-shadow: 0 0 0 3px var(--green-soft), 0 0 24px var(--green-glow); transform: translateY(-1px); }
  .btn-line { border-color: var(--line); }
  .btn-line:hover { border-color: var(--green); color: var(--green); }

  /* ---------- Top bar ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 18px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 15px/1 var(--display); }
  .avatar { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--raise); color: var(--green); font: 800 14px var(--display); flex-shrink: 0; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .top-right { display: flex; align-items: center; gap: 4px; }
  .mini-socials { display: flex; gap: 2px; margin-right: 10px; }
  .mini-socials a { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); transition: color .15s, background .15s; }
  .mini-socials a .ico { width: 18px; height: 18px; }
  .mini-socials a:hover { color: var(--green); background: var(--surface); }

  /* ---------- Creator card ---------- */
  .hero { padding-block: clamp(36px, 7vw, 80px) 40px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(20px, 4vw, 44px); align-items: center; }
  .hero .avatar { width: clamp(96px, 14vw, 156px); height: clamp(96px, 14vw, 156px); font-size: 48px; box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px var(--green), 0 0 40px -6px var(--green-glow); }
  .name-row { display: flex; align-items: center; gap: clamp(12px, 2vw, 20px); flex-wrap: wrap; margin-bottom: 14px; }
  h1 { font: 800 clamp(48px, 9vw, 112px)/.9 var(--display); font-stretch: 75%; letter-spacing: -.055em; }
  .flag { width: clamp(42px, 6vw, 72px); height: auto; aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
  .flag svg { width: 100%; height: 100%; display: block; }
  .bio { font-size: clamp(17px, 1.7vw, 20px); max-width: 52ch; }
  .loc { font: 500 13px/1 var(--display); color: var(--muted); margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .loc b { color: var(--green); font-weight: 600; }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-block: 1px solid var(--line); }
  .stat { padding: 20px 18px 18px 0; }
  .stat + .stat { padding-left: 18px; border-left: 1px solid var(--line); }
  .stat b { display: block; font: 800 clamp(26px, 3.6vw, 40px)/1 var(--display); letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
  .stat:first-child b { color: var(--green); text-shadow: 0 0 24px var(--green-glow); }
  .stat span { font-size: 14px; color: var(--muted); }
  .stats-note { font: 400 11px/1 var(--display); color: var(--muted); margin-top: 10px; text-align: right; }

  /* ---------- Tabs ---------- */
  .tabs-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: rgba(11,15,12,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); margin-top: 36px; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    position: relative; flex-shrink: 0; padding: 18px 16px 16px; font: 600 14px/1 var(--display); color: var(--muted);
    transition: color .15s;
  }
  .tab:first-child { padding-left: 0; }
  .tab::after { content: ""; position: absolute; left: 16px; right: 16px; bottom: -1px; height: 2px; background: var(--green); box-shadow: 0 0 10px var(--green-glow); transform: scaleX(0); transition: transform .25s ease; }
  .tab:first-child::after { left: 0; }
  .tab:hover { color: var(--fg); }
  .tab[aria-selected="true"] { color: var(--fg); }
  .tab[aria-selected="true"]::after { transform: scaleX(1); }
  .tab .count { font-weight: 400; color: var(--muted); margin-left: 6px; }

  .panel { padding-block: 40px 72px; animation: show .35s ease; }
  @keyframes show { from { opacity: 0; transform: translateY(8px); } }
  h2 { font: 700 clamp(26px, 3.6vw, 40px)/1.12 var(--display); letter-spacing: -.035em; margin-bottom: 14px; }
  .lede { color: var(--muted); max-width: 62ch; }
  .label { font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }

  /* ---------- Videos ---------- */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  .chip {
    font: 600 13px/1 var(--display); padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
    transition: border-color .15s, color .15s, background .15s;
  }
  .chip span { font-weight: 400; opacity: .7; margin-left: 4px; }
  .chip:hover { border-color: var(--green); color: var(--fg); }
  .chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--green-ink); }
  .chip[aria-pressed="true"] span { opacity: .8; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 22px; }
  .vid { display: grid; gap: 12px; align-content: start; }
  .thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--raise); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
  .vid:hover .thumb img { transform: scale(1.04); }
  .vid:hover .thumb { box-shadow: 0 0 0 1px var(--green), 0 0 26px -6px var(--green-glow); }
  .vid h3 { font: 600 16px/1.35 var(--body); transition: color .15s; }
  .vid:hover h3 { color: var(--green); }
  .vid-meta { display: flex; gap: 8px; flex-wrap: wrap; font: 500 11px/1.4 var(--display); color: var(--muted); margin-top: 6px; }
  .vid-meta .proj { color: var(--green); }
  .more-row { display: flex; justify-content: center; margin-top: 36px; }

  /* ---------- Community ---------- */
  .socials { display: grid; border-top: 1px solid var(--line); margin-top: 28px; }
  .soc {
    display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 18px; align-items: center;
    padding: 18px 12px; margin-inline: -12px; border-bottom: 1px solid var(--line); border-radius: 0;
    transition: background .15s;
  }
  .soc:hover { background: var(--surface); }
  .soc-ico { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--raise); color: var(--fg); transition: color .15s, box-shadow .15s; }
  .soc-ico .ico { width: 22px; height: 22px; }
  .soc:hover .soc-ico { color: var(--green); box-shadow: 0 0 0 1px var(--green), 0 0 20px -4px var(--green-glow); }
  .soc-name { font: 700 17px/1.2 var(--display); letter-spacing: -.02em; }
  .soc-sub { font-size: 15px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .soc-sub b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  .soc-act { font: 600 13px/1 var(--display); color: var(--green); display: inline-flex; align-items: center; gap: 6px; }
  .soc-act .ico { transition: transform .2s; }
  .soc:hover .soc-act .ico { transform: translate(2px, -2px); }
  .server-link { display: inline-flex; align-items: center; gap: 6px; margin-top: 22px; font: 600 14px/1 var(--display); color: var(--green); }
  .server-link:hover { text-shadow: 0 0 12px var(--green-glow); }

  /* ---------- Paid promotion ---------- */
  .promo-top { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 48px; align-items: start; }
  .reach { width: 100%; border-collapse: collapse; font-size: 15px; }
  .reach th { font: 600 11px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 0 12px 10px 0; border-bottom: 1px solid var(--line); }
  .reach td { padding: 14px 12px 14px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .reach td:first-child { font: 700 14px/1.5 var(--display); }
  .reach td:nth-child(2) { font-variant-numeric: tabular-nums; }
  .reach td:last-child { color: var(--muted); }
  .table-scroll { overflow-x: auto; }

  .offers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-top: 52px; border-top: 1px solid var(--line); }
  .offer { padding: 20px 20px 4px 0; }
  .offer + .offer { padding-left: 20px; border-left: 1px solid var(--line); }
  .offer h3 { font: 700 16px/1.3 var(--display); letter-spacing: -.02em; margin-bottom: 8px; }
  .offer p { font-size: 15px; color: var(--muted); }

  .brands { margin-top: 48px; display: flex; flex-wrap: wrap; gap: 8px 24px; font: 600 15px/1.4 var(--display); color: var(--muted); }

  .contact { margin-top: 56px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: clamp(22px, 4vw, 36px); }
  .contact h2 { margin-bottom: 8px; }
  .contact > p { color: var(--muted); max-width: 60ch; margin-bottom: 26px; }
  .ways { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .ways.one { grid-template-columns: minmax(0, 1fr); max-width: 520px; }
  .way { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: grid; gap: 14px; min-width: 0; transition: border-color .2s; }
  .way:hover { border-color: rgba(61,220,132,.5); }
  .way-head { display: flex; align-items: center; gap: 10px; font: 600 12px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .way-head .ico { width: 18px; height: 18px; color: var(--green); }
  .way-value { font: 700 clamp(16px, 2vw, 20px)/1.3 var(--display); letter-spacing: -.02em; overflow-wrap: anywhere; user-select: all; }
  .way-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .way-actions .btn { padding: 11px 14px; font-size: 13px; }
  .copied { color: var(--green); }

  /* ---------- Footer ---------- */
  footer { border-top: 1px solid var(--line); padding-block: 28px 40px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .panel { animation: none; }
    * { transition: none !important; }
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .promo-top { grid-template-columns: minmax(0, 1fr); gap: 32px; }
    .offers { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .offer:nth-child(3) { padding-left: 0; border-left: 0; }
    .offer:nth-child(n+3) { border-top: 1px solid var(--line); margin-top: 16px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat:nth-child(3) { padding-left: 0; border-left: 0; }
    .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
  }
  @media (max-width: 640px) {
    body { font-size: 16px; }
    .mini-socials { display: none; }
    .hero { grid-template-columns: minmax(0, 1fr); text-align: left; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .offers, .ways { grid-template-columns: minmax(0, 1fr); }
    .offer, .offer + .offer { padding: 18px 0 4px; border-left: 0; }
    .offer + .offer { border-top: 1px solid var(--line); }
    .offer:nth-child(n+3) { margin-top: 0; }
    .soc { grid-template-columns: 44px minmax(0, 1fr); gap: 14px; }
    .soc-act { grid-column: 2; }
    .soc-ico { width: 44px; height: 44px; }
    .stats-note { text-align: left; }
    .tab { padding-inline: 11px; font-size: 13px; }
    .tab::after { left: 11px; right: 11px; }
  }
</style>

    <span class="avatar" data-avatar></span>
    <div style="min-width:0">
      <div class="name-row">
        <h1 data-text="name"></h1>
        <span class="flag" role="img" aria-label="Scotland flag"><svg viewBox="0 0 640 480" aria-hidden="true"><path fill="#0065bd" d="M0 0h640v480H0z"/><path stroke="#fff" stroke-width=".6" d="m0 0l5 3M0 3l5-3" transform="scale(128 160)"/></svg></span>
      </div>
      <p class="bio" data-text="bio"></p>
      <div class="loc"><span>Based in</span><b data-text="location"></b><span>·</span><span>OG Fortnite creator</span></div>
    </div>
  </header>

  <div class="stats" id="stats"></div>
  <div class="stats-note">Numbers as of <span data-text="statsUpdated"></span></div>
</div>

<div class="tabs-bar">
  <div class="wrap">
    <div class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-videos" aria-controls="videos" data-tab="videos">Videos<span class="count" id="vidCount"></span></button>
      <button class="tab" role="tab" id="tab-community" aria-controls="community" data-tab="community">Community</button>
      <button class="tab" role="tab" id="tab-promo" aria-controls="promo" data-tab="promo">Paid Promotion</button>
    </div>
  </div>
</div>

<main class="wrap">
  <!-- VIDEOS -->
  <section class="panel" id="videos" role="tabpanel" aria-labelledby="tab-videos">
    <div class="filters" id="filters" aria-label="Filter videos"></div>
    <div class="grid" id="vidGrid"></div>
    <div class="more-row"><button class="btn btn-line" id="moreBtn" type="button"></button></div>
  </section>

  <!-- COMMUNITY -->
  <section class="panel" id="community" role="tabpanel" aria-labelledby="tab-community" hidden>
    <h2>Find me everywhere</h2>
    <p class="lede">New videos go on YouTube, quick clips go on TikTok, and the Discord is where everyone hangs out between uploads.</p>
    <div class="socials" id="socialList"></div>
    <a class="server-link" id="serverLink" href="#">What's inside the Discord server<svg data-icon="arrow"></svg></a>
  </section>

  <!-- PAID PROMOTION -->
  <section class="panel" id="promo" role="tabpanel" aria-labelledby="tab-promo" hidden>
    <div class="promo-top">
      <div>
        <div class="label">Paid promotion</div>
        <h2 data-text="promoHeadline"></h2>
        <p class="lede" data-text="promoIntro"></p>
      </div>
      <div class="table-scroll">
        <table class="reach">
          <thead><tr><th>Platform</th><th>Audience</th><th>Content</th></tr></thead>
          <tbody id="reachRows"></tbody>
        </table>
      </div>
    </div>

    <div class="offers" id="offers"></div>
    <div class="brands" id="brands" hidden></div>

    <div class="contact" id="contact">
      <h2>Get in touch</h2>
      <p data-text="replyNote"></p>
      <div class="ways" id="ways"></div>
    </div>
  </section>

  <footer>
    <span data-text="copyright"></span>
    <span data-text="disclaimer"></span>
  </footer>
</main>

<script>
(function () {
  const C = CONFIG;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Icons: Simple Icons (brand marks) and Tabler (UI), via All SVG Icons
  const svg = (body, fill) => '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"' + (fill ? ' fill="currentColor"' : ' fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"') + ">" + body + "</svg>";
  const ICONS = {
    discord: svg('<path d="M20.317 4.37a19.8 19.8 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.3 18.3 0 0 0-5.487 0a13 13 0 0 0-.617-1.25a.08.08 0 0 0-.079-.037A19.7 19.7 0 0 0 3.677 4.37a.1.1 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.08.08 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.08.08 0 0 0 .084-.028a14 14 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13 13 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10 10 0 0 0 .372-.292a.07.07 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.07.07 0 0 1 .078.01q.181.149.373.292a.077.077 0 0 1-.006.127a12.3 12.3 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.08.08 0 0 0 .084.028a19.8 19.8 0 0 0 6.002-3.03a.08.08 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.03M8.02 15.33c-1.182 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418m7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418"/>', true),
    youtube: svg('<path d="M23.498 6.186a3.02 3.02 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.02 3.02 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.02 3.02 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.02 3.02 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814M9.545 15.568V8.432L15.818 12z"/>', true),
    tiktok: svg('<path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02c.08 1.53.63 3.09 1.75 4.17c1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97c-.57-.26-1.1-.59-1.62-.93c-.01 2.92.01 5.84-.02 8.75c-.08 1.4-.54 2.79-1.35 3.94c-1.31 1.92-3.58 3.17-5.91 3.21c-1.43.08-2.86-.31-4.08-1.03c-2.02-1.19-3.44-3.37-3.65-5.71c-.02-.5-.03-1-.01-1.49c.18-1.9 1.12-3.72 2.58-4.96c1.66-1.44 3.98-2.13 6.15-1.72c.02 1.48-.04 2.96-.04 4.44c-.99-.32-2.15-.23-3.02.37c-.63.41-1.11 1.04-1.36 1.75c-.21.51-.15 1.07-.14 1.61c.24 1.64 1.82 3.02 3.5 2.87c1.12-.01 2.19-.66 2.77-1.61c.19-.33.4-.67.41-1.06c.1-1.79.06-3.57.07-5.36c.01-4.03-.01-8.05.02-12.07"/>', true),
    x: svg('<path d="M14.234 10.162L22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299l-.929-1.329L3.076 1.56h3.182l5.965 8.532l.929 1.329l7.754 11.09h-3.182z"/>', true),
    twitch: svg('<path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>', true),
    instagram: svg('<path d="M7.03.084c-1.277.06-2.149.264-2.91.563a5.9 5.9 0 0 0-2.124 1.388a5.9 5.9 0 0 0-1.38 2.127C.321 4.926.12 5.8.064 7.076s-.069 1.688-.063 4.947s.021 3.667.083 4.947c.061 1.277.264 2.149.563 2.911c.308.789.72 1.457 1.388 2.123a5.9 5.9 0 0 0 2.129 1.38c.763.295 1.636.496 2.913.552c1.278.056 1.689.069 4.947.063s3.668-.021 4.947-.082c1.28-.06 2.147-.265 2.91-.563a5.9 5.9 0 0 0 2.123-1.388a5.9 5.9 0 0 0 1.38-2.129c.295-.763.496-1.636.551-2.912c.056-1.28.07-1.69.063-4.948c-.006-3.258-.02-3.667-.081-4.947c-.06-1.28-.264-2.148-.564-2.911a5.9 5.9 0 0 0-1.387-2.123a5.9 5.9 0 0 0-2.128-1.38c-.764-.294-1.636-.496-2.914-.55C15.647.009 15.236-.006 11.977 0S8.31.021 7.03.084m.14 21.693c-1.17-.05-1.805-.245-2.228-.408a3.7 3.7 0 0 1-1.382-.895a3.7 3.7 0 0 1-.9-1.378c-.165-.423-.363-1.058-.417-2.228c-.06-1.264-.072-1.644-.08-4.848c-.006-3.204.006-3.583.061-4.848c.05-1.169.246-1.805.408-2.228c.216-.561.477-.96.895-1.382a3.7 3.7 0 0 1 1.379-.9c.423-.165 1.057-.361 2.227-.417c1.265-.06 1.644-.072 4.848-.08c3.203-.006 3.583.006 4.85.062c1.168.05 1.804.244 2.227.408c.56.216.96.475 1.382.895s.681.817.9 1.378c.165.422.362 1.056.417 2.227c.06 1.265.074 1.645.08 4.848c.005 3.203-.006 3.583-.061 4.848c-.051 1.17-.245 1.805-.408 2.23c-.216.56-.477.96-.896 1.38a3.7 3.7 0 0 1-1.378.9c-.422.165-1.058.362-2.226.418c-1.266.06-1.645.072-4.85.079s-3.582-.006-4.848-.06m9.783-16.192a1.44 1.44 0 1 0 1.437-1.442a1.44 1.44 0 0 0-1.437 1.442M5.839 12.012a6.161 6.161 0 1 0 12.323-.024a6.162 6.162 0 0 0-12.323.024M8 12.008A4 4 0 1 1 12.008 16A4 4 0 0 1 8 12.008"/>', true),
    mail: svg('<path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="m3 7l9 6l9-6"/>'),
    copy: svg('<path d="M7 9.667A2.667 2.667 0 0 1 9.667 7h8.666A2.667 2.667 0 0 1 21 9.667v8.666A2.667 2.667 0 0 1 18.333 21H9.667A2.667 2.667 0 0 1 7 18.333z"/><path d="M4.012 16.737A2 2 0 0 1 3 15V5c0-1.1.9-2 2-2h10c.75 0 1.158.385 1.5 1"/>'),
    arrow: svg('<path d="M17 7L7 17M8 7h9v9"/>')
  };
  $$("svg[data-icon]").forEach((el) => { el.outerHTML = ICONS[el.dataset.icon] || ""; });

  // Text
  $$("[data-text]").forEach((el) => { el.textContent = C[el.dataset.text] ?? ""; });
  document.title = C.name;

  // Avatar, with an "M" if the image is missing
  $$("[data-avatar]").forEach((el) => {
    el.textContent = C.name.charAt(0);
    if (!C.avatar) return;
    const img = new Image(); img.alt = "";
    img.onload = () => { el.textContent = ""; el.appendChild(img); };
    img.src = C.avatar;
  });

  // Headline numbers
  $("#stats").innerHTML = C.stats.map((s) => '<div class="stat"><b>' + esc(s.value) + "</b><span>" + esc(s.label) + "</span></div>").join("");

  // Small social icons in the top bar
  $("#miniSocials").innerHTML = C.socials.map((s) =>
    '<a href="' + esc(s.url) + '" target="_blank" rel="noopener" aria-label="' + esc(s.name) + '">' + (ICONS[s.id] || "") + "</a>").join("");

  // ---------- Tabs (the URL remembers the tab: send brands yoursite/#promo) ----------
  const TABS = ["videos", "community", "promo"];
  const openTab = (id, focus) => {
    if (!TABS.includes(id)) id = "videos";
    TABS.forEach((t) => {
      $("#" + t).hidden = t !== id;
      const b = $("#tab-" + t);
      b.setAttribute("aria-selected", String(t === id));
      b.tabIndex = t === id ? 0 : -1;
      if (t === id && focus) b.focus();
    });
    if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  };
  $$(".tab").forEach((b) => b.addEventListener("click", () => openTab(b.dataset.tab)));
  $(".tabs").addEventListener("keydown", (e) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const i = TABS.indexOf(document.activeElement.dataset.tab);
    if (i < 0) return;
    openTab(TABS[(i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length], true);
  });
  $$("[data-goto]").forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault(); openTab(a.dataset.goto);
    $(".tabs-bar").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }));
  addEventListener("hashchange", () => openTab(location.hash.slice(1)));
  openTab(location.hash.slice(1));

  // ---------- Videos with filters ----------
  const split = (t) => { const m = t.match(/^(.*?)\s*\(([^)]+)\)\s*$/); return m ? { title: m[1], proj: m[2] } : { title: t, proj: "" }; };
  let filter = "All", showAll = false;
  const filters = ["All", ...C.videoFilters];
  const countOf = (f) => f === "All" ? C.videos.length : C.videos.filter((v) => v.type === f).length;
  $("#vidCount").textContent = C.videos.length;
  $("#filters").innerHTML = filters.filter((f) => countOf(f) > 0).map((f) =>
    '<button class="chip" type="button" data-f="' + esc(f) + '" aria-pressed="' + (f === filter) + '">' + esc(f) + "<span>" + countOf(f) + "</span></button>").join("");

  const renderVids = () => {
    const list = C.videos.filter((v) => filter === "All" || v.type === filter);
    const shown = showAll ? list : list.slice(0, C.videosShownAtFirst);
    $("#vidGrid").innerHTML = shown.map((v) => {
      const s = split(v.title);
      return '<a class="vid" href="https://www.youtube.com/watch?v=' + encodeURIComponent(v.videoId) + '" target="_blank" rel="noopener">' +
        '<div class="thumb"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/' + encodeURIComponent(v.videoId) + '/mqdefault.jpg"></div>' +
        "<div><h3>" + esc(s.title) + '</h3><div class="vid-meta"><span>' + esc(v.type) + "</span>" + (s.proj ? '<span>·</span><span class="proj">' + esc(s.proj) + "</span>" : "") + "</div></div></a>";
    }).join("");
    $$("#vidGrid img").forEach((img) => img.addEventListener("error", () => img.remove()));
    const btn = $("#moreBtn");
    btn.parentElement.hidden = list.length <= C.videosShownAtFirst;
    btn.textContent = showAll ? "Show fewer" : "Show all " + list.length + " videos";
  };
  $("#filters").addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    filter = b.dataset.f; showAll = false;
    $$(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === b)));
    renderVids();
  });
  $("#moreBtn").addEventListener("click", () => { showAll = !showAll; renderVids(); });
  renderVids();

  // ---------- Community ----------
  $("#socialList").innerHTML = C.socials.map((s) =>
    '<a class="soc" href="' + esc(s.url) + '" target="_blank" rel="noopener">' +
    '<span class="soc-ico">' + (ICONS[s.id] || "") + "</span>" +
    '<span style="min-width:0"><span class="soc-name">' + esc(s.name) + '</span><span class="soc-sub"><span>' + esc(s.handle) + "</span>" +
      (s.stat ? '<span>·</span><b data-stat="' + esc(s.id) + '">' + esc(s.stat) + "</b>" : "") + "</span></span>" +
    '<span class="soc-act">' + esc(s.action) + ICONS.arrow + "</span></a>").join("");
  if (C.serverPage) $("#serverLink").href = C.serverPage; else $("#serverLink").hidden = true;

  // Live Discord member count, if Discord allows the request
  if (C.discordInviteCode) {
    fetch("https://discord.com/api/v9/invites/" + encodeURIComponent(C.discordInviteCode) + "?with_counts=true")
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((d) => {
        const el = $('[data-stat="discord"]');
        if (el && d.approximate_member_count) el.textContent = d.approximate_member_count.toLocaleString("en-GB") + " members, " + (d.approximate_presence_count || 0).toLocaleString("en-GB") + " online";
      })
      .catch(() => {});
  }

  // ---------- Paid promotion ----------
  $("#reachRows").innerHTML = C.reach.map((r) => "<tr><td>" + esc(r.platform) + "</td><td>" + esc(r.audience) + "</td><td>" + esc(r.format) + "</td></tr>").join("");
  $("#offers").innerHTML = C.offers.map((o) => '<div class="offer"><h3>' + esc(o.title) + "</h3><p>" + esc(o.text) + "</p></div>").join("");
  if (C.brands.length) { const b = $("#brands"); b.hidden = false; b.innerHTML = '<span class="label" style="width:100%">Worked with</span>' + C.brands.map((x) => "<span>" + esc(x) + "</span>").join(""); }

  const ways = [];
  if (C.contactMethods !== "discord" && C.email) ways.push(
    '<div class="way"><div class="way-head">' + ICONS.mail + "Email</div>" +
    '<div class="way-value" id="emailValue">' + esc(C.email) + "</div>" +
    '<div class="way-actions"><a class="btn btn-go" href="mailto:' + esc(C.email) + '?subject=' + encodeURIComponent("Paid promotion enquiry") + '">' + ICONS.mail + "Send an email</a>" +
    '<button class="btn btn-line" type="button" id="copyEmail">' + ICONS.copy + "<span>Copy</span></button></div></div>");
  if (C.contactMethods !== "email" && C.discordProfileUrl) ways.push(
    '<div class="way"><div class="way-head">' + ICONS.discord + "Discord</div>" +
    '<div class="way-value">@' + esc(C.discordUsername) + "</div>" +
    '<div class="way-actions"><a class="btn btn-go" href="' + esc(C.discordProfileUrl) + '" target="_blank" rel="noopener">' + ICONS.discord + "Message me on Discord</a></div></div>");
  $("#ways").innerHTML = ways.join("");
  $("#ways").classList.toggle("one", ways.length === 1);

  const copyBtn = $("#copyEmail");
  if (copyBtn) copyBtn.addEventListener("click", () => {
    const label = copyBtn.querySelector("span");
    const done = () => { label.textContent = "Copied"; copyBtn.classList.add("copied"); setTimeout(() => { label.textContent = "Copy"; copyBtn.classList.remove("copied"); }, 1800); };
    const select = () => { const r = document.createRange(); r.selectNodeContents($("#emailValue")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); label.textContent = "Press Ctrl+C"; };
    if (navigator.clipboard) navigator.clipboard.writeText(C.email).then(done, select); else select();
  });
})();
</script>
</body>
</html>
